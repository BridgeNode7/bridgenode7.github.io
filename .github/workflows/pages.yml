name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify website
        shell: bash
        run: |
          python3 - <<'PY_SITE'
          from pathlib import Path
          from hashlib import sha256
          root = Path('site')
          files = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert files == {'index.html'}, 'Unexpected website files'
          assert not any(p.is_symlink() for p in root.rglob('*'))
          page = (root / 'index.html').read_bytes()
          assert sha256(page).hexdigest() == 'fe75e4e580fd4bfd47128e08b01180d9b04828a3b121310d16f78bbc663ac450', 'Homepage bytes differ from approved design'
          assert b'<title>Bridge Node 7' in page
          assert b'-----BEGIN PRIVATE KEY-----' not in page
          print('Website verified')
          PY_SITE
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
