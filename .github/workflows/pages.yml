name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify gateway
        shell: bash
        run: |
          python3 - <<'PY_SITE'
          from pathlib import Path

          root = Path('site')
          files = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert files == {'index.html', '404.html'}, f'Unexpected website files: {sorted(files)}'
          assert not any(p.is_symlink() for p in root.rglob('*'))

          needles = (
              b'lang="en"',
              b'<title>Bridge Node 7</title>',
              b'<meta name="robots" content="noindex">',
              b'<meta http-equiv="refresh" content="0; url=https://bridgenode7.com/">',
              b'<link rel="canonical" href="https://bridgenode7.com/">',
              b'href="https://bridgenode7.com/">Continue to bridgenode7.com</a>',
              b"default-src 'none'",
              b"style-src 'unsafe-inline'",
          )

          for name in ('index.html', '404.html'):
              page = (root / name).read_bytes()
              assert b'<script' not in page.lower()
              assert b'-----BEGIN PRIVATE KEY-----' not in page
              assert b'http://' not in page
              for needle in needles:
                  assert needle in page, f'{name} missing {needle!r}'
          print('Gateway verified')
          PY_SITE
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
