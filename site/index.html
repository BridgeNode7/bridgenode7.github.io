<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e19">
  <meta name="description" content="Bridge Node 7. Illuminating Transformational Technologies. Frontier Mission Assurance. Accelerating Innovation. Bridging the Future.">
  <link rel="canonical" href="https://bridgenode7.com/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23090f1a%22%2F%3E%3Cpath%20d%3D%22M50%208L87%2029V71L50%2092L13%2071V29Z%20M50%208V50L87%2071M50%2050L13%2071M13%2029L50%2050L87%2029M50%2050V92%22%20fill%3D%22none%22%20stroke%3D%22%23e8c995%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%222.2%22%20fill%3D%22%23ffe6ae%22%2F%3E%3C%2Fsvg%3E">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bridge Node 7 | Illuminating Transformational Technologies">
  <meta property="og:description" content="Frontier Mission Assurance. Accelerating Innovation. Bridging the Future.">
  <title>Bridge Node 7 | Illuminating Transformational Technologies</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #080e19;
      --ivory: #f6f0e6;
      --champagne: #e8ca98;
      --copy: #e6e4df;
      --footer: #a3adbb;
      --cube-size: clamp(270px, 26vw, 362px);
      --contact-gap: 6px;
      --footer-offset: max(15px, env(safe-area-inset-bottom));
      --contact-height: calc(18px + 22.5px + var(--contact-gap));
    }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body { margin: 0; min-width: 280px; color: var(--ivory); background: var(--night);
      font-family: "Avenir Next", Avenir, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--champagne); outline-offset: 5px; border-radius: 2px; }
    .page { position: relative; isolation: isolate; min-height: 100svh; overflow: clip;
      background: radial-gradient(ellipse 45% 40% at 50% 50%, rgba(42,52,72,.17), transparent 78%),
      radial-gradient(ellipse 85% 90% at 50% 45%, rgba(14,23,40,.24), transparent 85%), var(--night); }
    .stage { position: relative; height: 100svh; min-height: 0; }
    .identity { position: absolute; left: 12px; right: 12px; top: 0;
      height: calc(50svh - var(--cube-size)/2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(12px, 1.5svh, 17px); text-align: center; }
    .identity h1 { margin: 0; font-family: Baskerville, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      font-size: 72px; font-weight: 400; line-height: 1.06;
      letter-spacing: .145em; padding-left: .145em; white-space: nowrap;
      color: var(--ivory); text-shadow: 0 1px 23px rgba(230,197,145,.14);
      background: linear-gradient(180deg, #fffdf6 8%, #f6ecd9 62%, #dfc596 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .identity .promise { margin: 0; max-width: min(96%, 770px); color: var(--copy);
      font-family: "Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      font-size: 21px; font-weight: 375;
      letter-spacing: .025em; line-height: 1.4; text-wrap: balance; }
    .symbol { position: absolute; display: block; left: 50%; top: 50svh;
      transform: translate(-50%, -50%); width: var(--cube-size); height: var(--cube-size);
      overflow: visible; filter: drop-shadow(0 0 25px rgba(221,178,109,.12)); }
    .symbol .soft-glow { transform-origin: 100px 100px; animation: cube-glow 12s ease-in-out infinite; }
    .symbol .point { animation: node-breathe 12s ease-in-out infinite; }
    @keyframes cube-glow { 0%,100% { opacity: .76; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.09); } }
    @keyframes node-breathe { 0%,100% { opacity: .82; } 50% { opacity: 1; } }
    .lower { position: absolute; left: 14px; right: 14px;
      top: calc(50svh + var(--cube-size) * .435); bottom: calc(var(--footer-offset) + var(--contact-height));
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 0; padding: 0; text-align: center; }
    .mission { display: flex; flex-direction: column; align-items: center; gap: clamp(7px, 1.2vh, 13px); }
    .mission p { margin: 0; color: var(--copy);
      font-family: "Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", Arial, sans-serif;
      font-size: 18px; font-weight: 375;
      line-height: 1.28; letter-spacing: .036em; text-wrap: balance; }
    .connect { display: flex; flex-direction: column; align-items: center; gap: var(--contact-gap); }
    .connect strong { font-size: 12px; line-height: 18px; font-weight: 620; letter-spacing: .20em; text-transform: uppercase; }
    .connect a { color: #d3b788; font-size: 15px; line-height: 1.5; text-decoration: none;
      border-bottom: 1px solid transparent; transition: color .22s ease, border-color .22s ease; }
    .connect a:hover { color: #ffe5b5; border-color: currentColor; }
    .footer { position: absolute; left: 0; right: 0;
      bottom: var(--footer-offset); display: flex;
      align-items: flex-end; justify-content: center;
      padding: 0 14px; text-align: center; color: var(--footer); }
    @media (max-height: 830px) and (min-width: 651px) {
      :root { --cube-size: clamp(218px, 35svh, 288px); }
      .identity { gap: 9px; }
      .identity h1 { font-size: 54px; }
      .identity .promise { font-size: 21px; }
      .mission { gap: 6px; }
      .mission p { font-size: 15px; }
      :root { --contact-gap: 4px; }
    }
    @media (min-width: 651px) and (max-width: 1150px) {
      .identity h1 { font-size: 54px; }
    }
    @media (max-width: 650px) {
      :root { --cube-size: clamp(188px, 60vw, 250px); }
      .identity { left: 10px; right: 10px; gap: 9px; }
      .identity h1 { font-size: 30px; letter-spacing: .075em; padding-left: .075em; }
      .identity .promise { max-width: 365px; font-size: 15px;
        letter-spacing: .008em; }
      .lower { left: 13px; right: 13px; }
      .mission { gap: 9px; }
      .mission p { font-size: 15px; letter-spacing: .008em; }
      :root { --contact-gap: 5px; }
      .footer { padding: 0 14px; }
    }
    @media (min-width: 421px) and (max-width: 650px) {
      .identity h1 { font-size: 36px; }
      .identity .promise { font-size: 18px; }
    }
    @media (max-width: 360px) {
      :root { --cube-size: clamp(172px, 57vw, 196px); }
      .identity h1 { font-size: 27px; letter-spacing: .06em; padding-left: .06em; }
      .identity .promise { font-size: 15px; letter-spacing: 0; }
      .mission { gap: 6px; }
      .mission p { font-size: 15px; }
    }
    @media (max-height: 740px) and (max-width: 650px) {
      :root { --cube-size: clamp(172px, 30svh, 202px); }
      .mission { gap: 5px; }
      .mission p { font-size: 15px; }
      :root { --contact-gap: 3px; }
    }
    @media (max-height: 700px) and (min-width: 651px) {
      .mission { gap: 5px; }
      .mission p { font-size: 15px; }
    }
    @media (max-height: 590px) {
      .page { overflow: visible; display: flex; flex-direction: column; min-height: 100svh; }
      .stage { height: auto; min-height: 0; flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 22px; padding: 34px 15px 23px; }
      .identity, .symbol, .lower { position: relative; inset: auto; top: auto; left: auto; right: auto;
        bottom: auto; height: auto; transform: none; }
      .identity { width: 100%; gap: 10px; }
      .identity h1 { font-size: clamp(27px, 5vw, 45px); }
      .identity .promise { font-size: clamp(15px, 2.8vw, 18px); }
      .symbol { width: clamp(158px, 32svh, 210px); height: clamp(158px, 32svh, 210px); flex: none; }
      .lower { width: 100%; display: flex; gap: 28px; padding: 0; }
      .mission { gap: 6px; }
      .footer { position: relative; inset: auto; left: auto; right: auto; padding: 10px 15px 17px; }
    }
    @media (prefers-contrast: more) {
      .identity .promise, .connect a { color: #f3dcba; }
      .footer { color: #ccd5df; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="stage">
      <header class="identity">
        <h1>BRIDGE NODE 7</h1>
        <p class="promise">~Illuminating Transformational Technologies~</p>
      </header>
      <svg class="symbol" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="symbolTitle">
        <title id="symbolTitle">Bridge Node 7 dimensional cube</title>
        <defs>
          <linearGradient id="gold" x1="2%" y1="0%" x2="96%" y2="100%">
            <stop offset="0%" stop-color="#fff2cb"/>
            <stop offset="55%" stop-color="#ebcb94"/>
            <stop offset="100%" stop-color="#aa8852"/>
          </linearGradient>
          <radialGradient id="radiance">
            <stop offset="0%" stop-color="#ffde9c" stop-opacity=".52"/>
            <stop offset="58%" stop-color="#d3b479" stop-opacity=".12"/>
            <stop offset="100%" stop-color="#d3b479" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M100 13 L178 56 L178 144 L100 187 L22 144 L22 56 Z" fill="none" stroke="url(#gold)" stroke-width="1.55" stroke-linejoin="round"/>
        <path d="M100 13 L100 100 L178 144 M100 100 L22 144 M22 56 L100 100 L178 56 M100 100 L100 187" fill="none" stroke="#f0d4a1" stroke-opacity=".78" stroke-width="1.02" stroke-linejoin="round"/>
        <path d="M22 56 L178 144 M178 56 L22 144" fill="none" stroke="#d6b781" stroke-opacity=".07" stroke-width=".65"/>
        <g class="soft-glow">
          <circle cx="100" cy="100" r="36" fill="url(#radiance)"/>
          <circle cx="100" cy="100" r="11" fill="none" stroke="#f0d8a8" stroke-opacity=".25" stroke-width=".55"/>
        </g>
        <circle class="point" cx="100" cy="100" r="3.1" fill="#ffe6ae"/>
      </svg>
      <section class="lower" aria-label="Bridge Node 7 mission statements">
        <div class="mission">
          <p>Frontier Mission Assurance</p>
          <p>Accelerating Innovation</p>
          <p>Bridging the Future</p>
        </div>
      </section>
    </main>
    <footer class="footer" aria-label="Contact Bridge Node 7">
      <div class="connect">
        <strong>Connect</strong>
        <a href="mailto:contact@bridgenode7.com">contact@bridgenode7.com</a>
      </div>
    </footer>
  </div>
</body>
</html>
